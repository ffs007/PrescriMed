    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://prescrimed1.lovable.app/#website",
          "url": "https://prescrimed1.lovable.app/",
          "name": "PrescriMed",
          "description": "Prescrição rápida e segura para médicos de urgência e emergência.",
          "inLanguage": "pt-BR"
        },
        {
          "@type": "SoftwareApplication",
          "name": "PrescriMed",
          "applicationCategory": "MedicalApplication",
          "operatingSystem": "Web",
          "url": "https://prescrimed1.lovable.app/",
          "description": "Plataforma de prescrição rápida para médicos: receitas (comum, especial, antimicrobiano), atestados, encaminhamentos e exames com alertas clínicos e modelos prontos.",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "BRL",
            "description": "Teste grátis por 1 mês"
          }
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "É só receita ou emite outros documentos do atendimento?",
              "acceptedAnswer": { "@type": "Answer", "text": "É uma central de emissão clínica completa: receita (comum, especial e controle), solicitação de exames, encaminhamento, atestado, declaração de comparecimento, relatório de atendimento e orientações com plano de retorno — todos no mesmo fluxo do paciente." }
            },
            {
              "@type": "Question",
              "name": "Funciona bem no celular durante o atendimento?",
              "acceptedAnswer": { "@type": "Answer", "text": "Sim. A interface é construída mobile-first para plantão e ambulatório: toques grandes, fluxo em etapas, preview do documento em drawer e sem campos espremidos." }
            },
            {
              "@type": "Question",
              "name": "Serve para recém-formado e médico experiente?",
              "acceptedAnswer": { "@type": "Answer", "text": "Sim. O recém-formado ganha apoio em dose, contraindicação e padrão de documento. O médico experiente ganha velocidade — atalhos, modelos próprios e busca instantânea para o atendimento real." }
            },
            {
              "@type": "Question",
              "name": "Quem é responsável legalmente pelos documentos emitidos?",
              "acceptedAnswer": { "@type": "Answer", "text": "Você. O PrescriMed+ é ferramenta de apoio à decisão clínica — equivalente a calculadora e bulário digital. A responsabilidade legal pelo documento emitido é, em qualquer cenário, do médico assinante. Por isso o fluxo sempre exige revisão antes da emissão." }
            },
            {
              "@type": "Question",
              "name": "De onde vêm as doses e diretrizes utilizadas?",
              "acceptedAnswer": { "@type": "Answer", "text": "A base é construída a partir de fontes oficiais brasileiras (Anvisa, DEF, bulas) e diretrizes de sociedades médicas reconhecidas. Cada referência é versionada e auditável dentro da plataforma." }
            },
            {
              "@type": "Question",
              "name": "Meus dados e dos meus pacientes ficam seguros?",
              "acceptedAnswer": { "@type": "Answer", "text": "Sim. Aderência estrita à LGPD, criptografia em trânsito e em repouso, e princípio de minimização de dados. Você é o controlador dos dados clínicos que registrar." }
            },
            {
              "@type": "Question",
              "name": "Posso cancelar quando quiser?",
              "acceptedAnswer": { "@type": "Answer", "text": "Sim. Não há renovação automática nem multa. Ao final do período contratado, basta não renovar — o acesso simplesmente expira." }
            }
          ]
        }
      ]
    }
    </script>
