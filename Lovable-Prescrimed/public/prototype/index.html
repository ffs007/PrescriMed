<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout clínico PrescriMed — busca de condição, módulos documentais e assistente flutuante. */
:root{
  --bg:#F7F9FF; --surface:#FFFFFF; --soft:#EDF4FF; --line:#C0C7D0; --ink:#121D26; --muted:#40484F;
  --accent:#005E8A; --accent-ink:#FFFFFF; --accent-soft:#E4EFFD;
  --ok:#2D8A57; --warn:#C99020; --warn-soft:#FBF4E4; --bad:#BA1A1A; --bad-soft:#FDF3F2;
  --f-display:Inter, system-ui, sans-serif; --f-body:Inter, system-ui, sans-serif; --f-mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r:4px; --shadow:0 1px 2px rgba(16,24,40,.06), 0 8px 24px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B1220; --surface:#111A2B; --soft:#17243A; --line:#344054; --ink:#F2F4F7; --muted:#98A2B3;
  --accent:#4D83FF; --accent-ink:#FFFFFF; --accent-soft:#162D5E;
  --ok:#32C99A; --warn:#FDB022; --warn-soft:#3A2B12; --bad:#F97066; --bad-soft:#3A1C21; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0B1220; --surface:#111A2B; --soft:#17243A; --line:#344054; --ink:#F2F4F7; --muted:#98A2B3;
  --accent:#4D83FF; --accent-ink:#FFFFFF; --accent-soft:#162D5E;
  --ok:#32C99A; --warn:#FDB022; --warn-soft:#3A2B12; --bad:#F97066; --bad-soft:#3A1C21; color-scheme:dark }
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font:16px/1.5 var(--f-body);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px}
/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:8px;font-family:var(--f-display);font-weight:800;font-size:18px;cursor:pointer;white-space:nowrap}
.brand small{font:500 12px var(--f-mono);color:var(--muted)}
.ptchip{margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;min-width:0;max-width:60vw}
.ptchip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptchip b{font-weight:700}
.ptchip .dot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none}
.ptchip.ok .dot{background:var(--ok)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:18px;height:18px}
/* botões e campos */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 14px;cursor:pointer;font-weight:700;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>span{font:700 11px/1.2 var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.in,.sel,.ta{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
.ta{min-height:96px;resize:vertical;line-height:1.45}
.grid{display:grid;gap:10px 12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.check{display:flex;gap:8px;align-items:center;cursor:pointer}
.check input{width:17px;height:17px;accent-color:var(--accent)}
.note{color:var(--muted);font-size:14px}
.status{font-size:14px;color:var(--muted);min-height:1.2em}
.status.ok{color:var(--ok)} .status.err{color:var(--bad)}
/* início */
.hero{padding-block:28px 10px}
.hero h1{font-size:clamp(28px,4.4vw,42px);font-weight:800;line-height:1.08}
.hero p{color:var(--muted);margin:8px 0 18px;max-width:62ch}
.search{position:relative}
.search input{font-size:19px;padding:15px 16px 15px 46px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);width:100%}
.search input:focus{border-color:var(--accent)}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted)}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.pos{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.chip.neg{background:var(--soft);text-decoration:line-through;color:var(--muted)}
.chip.alt{border-style:dashed}
.chip.alt.on{background:var(--warn-soft);color:var(--ink);border-color:var(--warn);border-style:solid}
.chip.norm.on{background:var(--accent-soft);color:var(--ink);border-color:var(--accent)}
.catgroup{margin-top:22px}
.catgroup h2{font:700 12px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.conds{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.cond{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.cond:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.cond b{font-weight:700;line-height:1.3}
.cond small{font:12px var(--f-mono);color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}
/* condição */
.crumb{display:inline-flex;align-items:center;gap:6px;color:var(--muted);cursor:pointer;background:none;border:0;padding:16px 0 4px;font-weight:700}
.chead{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;padding-bottom:6px}
.chead h1{font-size:clamp(26px,3.8vw,36px);font-weight:800;line-height:1.1}
.chead .cat{font:700 12px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.cids{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cids .chip{font-family:var(--f-mono);font-size:12.5px}
.alertbox{margin:14px 0 0;border:1px solid var(--warn);background:var(--warn-soft);border-radius:var(--r);padding:10px 14px;font-size:15px}
.alertbox.bad{border-color:var(--bad);background:var(--bad-soft)}
.alertbox b{font-family:var(--f-display)}
.mods{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));margin:18px 0 24px}
.mod{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;text-align:left;cursor:pointer;display:grid;grid-template-columns:36px 1fr;gap:4px 12px;align-items:start;min-width:0}
.mod:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.mod .ic{grid-row:span 2;width:36px;height:36px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.mod .ic svg{width:19px;height:19px}
.mod b{font-family:var(--f-display);font-weight:700;line-height:1.25}
.mod small{color:var(--muted);font-size:13px}
.mod.done small{color:var(--ok);font-weight:700}
.sumcard{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:16px;margin-bottom:40px}
.sumcard h2{font-size:18px;margin-bottom:8px}
.sumtxt{white-space:pre-wrap;font-size:15px;max-height:340px;overflow:auto;color:var(--ink)}
/* janela de módulo */
dialog.modal{border:0;padding:0;border-radius:14px;width:min(1000px,calc(100vw - 24px));max-height:calc(100vh - 32px);background:var(--bg);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog.modal::backdrop{background:rgba(10,20,18,.45)}
.mhead{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.mhead h2{font-size:20px;line-height:1.2}
.mhead small{display:block;color:var(--muted);font-size:13px}
.mhead .x{margin-left:auto}
.mbody{padding:16px 18px 22px;display:flex;flex-direction:column;gap:16px}
.mfoot{position:sticky;bottom:0;z-index:2;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 18px;background:var(--surface);border-top:1px solid var(--line)}
@media (max-width:600px){.mfoot{padding:8px 12px;gap:6px}.mfoot .btn{padding:7px 11px;font-size:13.5px}.mfoot .status{flex-basis:100%}}
.box{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.box>h3{font-size:15px;font-weight:700}
.box>h3 small{font:400 13px var(--f-body);color:var(--muted);margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.efrow{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;align-items:start;padding:6px 0;border-top:1px dashed var(--line)}
.efrow:first-of-type{border-top:0}
.efrow>span{font-weight:700;font-size:14px;padding-top:4px}
.drow{border-top:1px solid var(--line);padding:10px 0;display:flex;flex-direction:column;gap:6px}
.drow:first-of-type{border-top:0}
.dhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dhead .nm{font-weight:700}
.badge{font:500 10.5px var(--f-mono);text-transform:uppercase;border-radius:4px;padding:2px 6px;background:var(--accent-soft);color:var(--accent)}
.badge.w{background:var(--warn-soft);color:var(--warn)}
.badge.b{background:var(--bad-soft);color:var(--bad)}
.line{font-family:var(--f-mono);font-size:13.5px;background:var(--soft);border-radius:7px;padding:8px 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.det{font-size:12.5px;color:var(--muted)}
.warn{font-size:13.5px;color:var(--warn)} .err{font-size:13.5px;color:var(--bad)}
.rxlist{display:flex;flex-direction:column;gap:6px;counter-reset:n}
.rxitem{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.rxitem .n{font:700 14px var(--f-mono);color:var(--muted);padding-top:2px}
.rxitem .t{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px}
.x{border:0;background:none;cursor:pointer;color:var(--muted);font-size:20px;line-height:1;padding:2px 6px;border-radius:6px}
.x:hover{color:var(--bad);background:var(--bad-soft)}
.preview{display:flex;flex-direction:column;gap:10px;align-items:center}
.preview canvas{width:100%;max-width:640px;height:auto;border:1px solid var(--line);border-radius:6px;background:#fff}
.two{display:grid;gap:16px;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
.exitem{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:14.5px;padding:3px 0}
.exitem small{font:12px var(--f-mono);color:var(--muted)}
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:2px 14px}
details.grp>summary{cursor:pointer;font-weight:700;padding:4px 0}
/* resultado de escore */
.sc-res{border:1px solid var(--line);border-left-width:5px;border-radius:9px;padding:10px 12px;background:var(--surface)}
.sc-res.ok{border-left-color:var(--ok)} .sc-res.warn{border-left-color:var(--warn)} .sc-res.bad{border-left-color:var(--bad)}
.sc-big{font:800 19px/1.25 var(--f-display)}
/* chat */
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:12px 18px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.25);cursor:pointer}
.fab svg{width:18px;height:18px}
[hidden]{display:none!important}
.chat{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;width:min(420px,calc(100vw - 32px));height:min(620px,calc(100vh - 100px));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;overflow:hidden}
.chat header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.chat header b{font-family:var(--f-display)}
.chat header small{color:var(--muted);font-size:12px;display:block}
.msgs{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:92%;padding:9px 12px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--soft);border-bottom-left-radius:4px}
.msg .act{display:flex;gap:6px;margin-top:6px}
.qk{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 8px}
.qk .chip{font-size:12.5px}
.chat form{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.chat textarea{flex:1;min-height:42px;max-height:120px;resize:none}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;font-size:14.5px;box-shadow:var(--shadow)}
@media (max-width:760px){
  .two{grid-template-columns:1fr}
  .efrow{grid-template-columns:1fr}
  dialog.modal{width:100vw;max-width:100vw;max-height:100vh;height:100%;border-radius:0;margin:0}
  .mods{grid-template-columns:1fr 1fr}
  .mod{grid-template-columns:1fr}.mod .ic{grid-row:auto}
  .brand small{display:none}
  .fab span{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
